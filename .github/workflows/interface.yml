name: Check local interface
on: [push, pull_request, workflow_dispatch]
jobs:
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt -r gui/requirements.txt
      - run: python -m unittest discover -s gui/tests
